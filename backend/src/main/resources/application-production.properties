# Production Configuration for Railway Deployment
spring.application.name=RK Food Backend

# MongoDB Configuration - Read from environment variable
# SPRING_DATA_MONGODB_URI should be set in Railway environment variables
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration - Allow all origins for production (should be restricted in future)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Server configuration
server.port=${PORT:8080}
